services:
  floci:
    image: floci/floci:latest
    environment:
      FLOCI_HOSTNAME: floci
    volumes:
      - floci-data:/app/data
    restart: unless-stopped

  api:
    build: ../../backend
    env_file: ../../backend/.env
    environment:
      NODE_ENV: production
      AWS_ENDPOINT_URL: http://floci:4566
    expose:
      - "3000"
    depends_on:
      - floci
    restart: unless-stopped

  web:
    build:
      context: ../../frontend
      args:
        VITE_API_URL: ""
        VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file: ../../.env.cloud
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

  scheduler:
    image: curlimages/curl
    env_file: ../../backend/.env
    entrypoint: ["sh", "-c"]
    command:
      - >
        sleep 30;
        while true; do
          curl -s -H "Authorization: Bearer $$CRON_SECRET" http://api:3000/api/cron/reminders;
          echo; sleep 3600;
        done
    depends_on:
      - api
    restart: unless-stopped

volumes:
  floci-data:
  caddy-data:
  caddy-config:
