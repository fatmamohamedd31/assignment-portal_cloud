# Render Blueprint for a single public app URL with private Floci services.
# Add the secret values in the Render dashboard after creating the Blueprint.
services:
  - type: pserv
    name: assignment-portal-floci
    runtime: image
    image:
      url: docker.io/floci/floci:latest
    plan: starter
    region: frankfurt
    envVars:
      - key: FLOCI_HOSTNAME
        value: assignment-portal-floci

  - type: web
    name: assignment-portal
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: INSTRUCTOR_INVITE_CODE
        sync: false
      - key: AWS_ENDPOINT_HOSTPORT
        fromService:
          type: pserv
          name: assignment-portal-floci
          property: hostport
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: portal-submissions
      - key: ASSIGNMENT_FANOUT
        value: "false"
      - key: TURNSTILE_SECRET_KEY
        value: 1x0000000000000000000000000000000AA
      - key: VITE_API_URL
        value: ""
      - key: VITE_TURNSTILE_SITE_KEY
        value: 1x00000000000000000000AA
